workflows:
  android-apk:
    name: Gerar APK Android
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Criar estrutura Android
        script: |
          flutter create . --platforms android --org com.garcomfacil --project-name garcom_facil
      - name: Baixar dependencias
        script: flutter pub get
      - name: Gerar APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
